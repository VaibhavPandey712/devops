name: Building Blocks

on: push

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, world"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed Steps
        run: |
          echo "This step will fail"
          exit 1
      - name: Say Bye
        run: echo "Bye"