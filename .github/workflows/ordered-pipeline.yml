name: Ordered Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deliberately fail setup
        run: |
          echo "Setup done"
          exit 1

  verify:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify runtime
        run: |
          python --version
          echo "Verify done"

  finish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Finish pipeline
        run: echo "Pipeline finished"